<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <title>Age of Tokens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <header class="hero" id="hero">
    <div id="sky"></div>
    <div class="astro" id="astro"></div>
    <div class="hero-text">
      <p class="status" id="status"><span id="status-text">Conectando</span></p>
      <h1 class="era" id="era">Age of Tokens</h1>
      <p class="era-next" id="era-next">&nbsp;</p>
    </div>
  </header>

  <section class="panel level" aria-label="Nível da aldeia">
    <div class="level-head">
      <span class="lbl">Nível</span>
      <strong class="level-num" id="level">0</strong>
      <span class="income" id="income">renda 0</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="bar-fill"></i></div>
    <p class="note" id="bar-note">&nbsp;</p>
  </section>

  <section class="resources" aria-label="Recursos">
    <div class="res" data-res="food"><span class="who" data-sprite="villager" data-px="2"></span><div class="ico" data-sprite="food"></div><span class="name">Comida</span><b class="val" id="v-food">0</b></div>
    <div class="res" data-res="wood"><span class="who" data-sprite="villager" data-px="2"></span><div class="ico" data-sprite="wood"></div><span class="name">Madeira</span><b class="val" id="v-wood">0</b></div>
    <div class="res" data-res="stone"><span class="who" data-sprite="villager" data-px="2"></span><div class="ico" data-sprite="stone"></div><span class="name">Pedra</span><b class="val" id="v-stone">0</b></div>
    <div class="res" data-res="gold"><span class="who" data-sprite="villager" data-px="2"></span><div class="ico" data-sprite="gold"></div><span class="name">Ouro</span><b class="val" id="v-gold">0</b></div>
  </section>

  <section class="panel village" aria-label="Aldeia">
    <h2>Aldeia</h2>
    <dl class="stats">
      <div><dt><span data-sprite="villager" data-px="2"></span>População</dt><dd id="s-pop">0/0</dd></div>
      <div><dt><span data-sprite="house" data-px="2"></span>Prédios</dt><dd id="s-build">0</dd></div>
      <div><dt><span data-sprite="book" data-px="2"></span>Pesquisas</dt><dd id="s-tech">0</dd></div>
      <div><dt><span data-sprite="hammer" data-px="2"></span>Pontos de obra</dt><dd id="s-work">0</dd></div>
    </dl>
  </section>

  <section class="panel tokens" aria-label="Tokens gastos">
    <h2>Tokens gastos</h2>
    <dl class="stats tok">
      <div><dt><span data-sprite="token" data-px="2"></span>Saída</dt><dd id="t-output">0</dd></div>
      <div><dt><span data-sprite="token" data-px="2"></span>Cache lido</dt><dd id="t-cacheRead">0</dd></div>
      <div><dt><span data-sprite="token" data-px="2"></span>Entrada e cache criado</dt><dd id="t-in">0</dd></div>
      <div><dt><span data-sprite="token" data-px="2"></span>Pensamento</dt><dd id="t-thinking">0</dd></div>
    </dl>
  </section>

  <section class="panel chronicle" aria-label="Crônica">
    <h2>Crônica</h2>
    <ol class="log" id="log"><li class="empty">A aldeia aguarda o primeiro sinal.</li></ol>
  </section>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
